name: Backend Runtime Contract CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python compile and runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest packaging pyyaml fastapi aiofiles sqlalchemy numpy scipy trimesh pillow psutil scikit-image matplotlib

      - name: Compile backend Python sources
        run: python -m compileall -q backend

      - name: Check model downloader shell syntax
        run: bash -n backend/scripts/download_models.sh

      - name: Run backend compatibility contracts
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests backend/thirdparty/tests/test_runtime_path_utils.py

  resolver-tests:
    name: Compute mode resolver tests (CPU-only host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shell script resolver tests
        run: bash scripts/tests/compute_mode_test.sh
