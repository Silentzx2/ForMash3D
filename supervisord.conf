[supervisord]
nodaemon=true
user=root
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6380 --save "" --appendonly no --logfile ""
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=/opt/conda/envs/3daigc-api/bin/python scripts/scheduler_service.py --redis-url redis://localhost:6380 --log-level info
directory=/app/backend
environment=PYTHONPATH="/app/backend:/app"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startretries=3

[program:api]
command=/opt/conda/envs/3daigc-api/bin/uvicorn api.main_multiworker:app --host 0.0.0.0 --port 7842 --workers 4 --log-level info
directory=/app/backend
environment=PYTHONPATH="/app/backend:/app",P3D_REDIS_URL="redis://localhost:6380"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startretries=3

[program:frontend]
command=/bin/bash -c "export PATH=/root/.bun/bin:$PATH && exec bun run start -p 3000 -H 0.0.0.0"
directory=/app
environment=NODE_ENV="production",PORT="3000",NEXT_PUBLIC_API_URL="http://localhost:7842"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startretries=3
