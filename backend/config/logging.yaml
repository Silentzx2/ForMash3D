# Logging Configuration for 3D Generative Models API
# This configuration uses Python's dictConfig format

version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(lineno)d - %(funcName)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  simple:
    format: "%(levelname)s - %(name)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout
  
  master_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/master.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    mode: a
    encoding: utf8

loggers:
  "":  # Root logger
    level: INFO
    handlers: [console, master_file]
    propagate: false
  
  api:
    level: INFO
    handlers: [console, master_file]
    propagate: false
  
  core.scheduler:
    level: DEBUG
    handlers: [console, master_file]
    propagate: false

  core.models:
    level: INFO
    handlers: [console, master_file]
    propagate: false

  core:
    level: INFO
    handlers: [console, master_file]
    propagate: false
  
  adapters:
    level: INFO
    handlers: [console, master_file]
    propagate: false

  postprocess:
    level: INFO
    handlers: [console, master_file]
    propagate: false
  
  uvicorn:
    level: INFO
    handlers: [console, master_file]
    propagate: false
  
  uvicorn.access:
    level: INFO
    handlers: [console, master_file]
    propagate: false
  
  uvicorn.error:
    level: INFO
    handlers: [console, master_file]
    propagate: false

root:
  level: INFO
  handlers: [console, master_file]
