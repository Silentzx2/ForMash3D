# image-conditioned geometry+texture generation (legacy aliases routing to raw geometry)
image_to_textured_mesh:
  trellis_image_to_textured_mesh:
    alias_of: "trellis_image_to_3d"
    deprecated: true
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
      deprecated: true
      alias_of: "trellis_image_to_3d"
    vram_requirement: 11776  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

  trellis2_image_to_textured_mesh:
    alias_of: "trellis2_image_to_3d"
    deprecated: true
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      native_pbr: false
      high_fidelity_geometry: true
      vertex_color: false
      mesh_quality_characteristics: [sharp_features, open_surfaces, non_manifold_safe]
      preferred_preprocessing: native_detail
      preferred_extraction: o_voxel
      preferred_resolution: 1536
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: quality
      quality_priority: 100
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
      deprecated: true
      alias_of: "trellis2_image_to_3d"
    vram_requirement: 23552  # MB (23GB, TRELLIS.2)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS.2"
    enabled: true
    max_workers: 1

# image-conditioned mesh painting
image_mesh_painting:
  trellis_image_mesh_painting:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 11776  # MB
    supported_inputs: ["mesh", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

  trellis2_image_mesh_painting:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 23552   # MB (23GB, TRELLIS.2)
    supported_inputs: ["mesh", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS.2"
    enabled: true
    max_workers: 1

  hunyuan3d_paint_v21_image_mesh_painting:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 12000  # MB — lowered from 21504; CPU offload keeps peak below 15GB
    supported_inputs: ["mesh", "text", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2.1"
    enabled: true
    max_workers: 1

  paint3d:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
      supported_resolutions: [1024, 2048]
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 12000  # MB
    supported_inputs: ["mesh", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/Paint3D"
    enabled: true
    max_workers: 1


# mesh segmentation (no active adapter is configured)
mesh_segmentation: {}

# auto-rigging
auto_rig:
  unirig_auto_rig:
    capabilities:
      auto_rig: true
      character_output: true
    vram_requirement: 9216  # MB
    supported_inputs: ["obj", "glb", "fbx"]
    supported_outputs: ["glb", "fbx"]
    model_path: "backend/pretrained/UniRig"
    enabled: true
    max_workers: 1

# mesh retopology
mesh_retopology:
  fastmesh_v1k_retopology:
    capabilities:
      retopology: true
      target_variant: "V1K"
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 16384  # MB
    init_params:
      variant: "V1K"
    supported_inputs: ["obj", "glb", "ply", "stl"]
    supported_outputs: ["obj", "glb", "ply"]
    model_path: "backend/pretrained/FastMesh-V1K"
    enabled: true
    max_workers: 1
    
  fastmesh_v4k_retopology:
    capabilities:
      retopology: true
      target_variant: "V4K"
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 24500  # MB
    init_params:
      variant: "V4K"
    supported_inputs: ["obj", "glb", "ply", "stl"]
    supported_outputs: ["obj", "glb", "ply"]
    model_path: "backend/pretrained/FastMesh-V4K"
    enabled: true
    max_workers: 1

# UV unwrapping
uv_unwrapping:
  partuv_uv_unwrapping:
    capabilities:
      uv_unwrap: true
    vram_requirement: 7168  # MB
    supported_inputs: ["obj", "glb"]
    supported_outputs: ["obj"]
    model_path: "backend/pretrained/PartUV/model_objaverse.ckpt"
    enabled: true
    max_workers: 1

# Motion generation (ARDY)
motion_generation:
  ardy_motion_generation:
    capabilities:
      motion_generation: true
    vram_requirement: 8192  # MB
    supported_inputs: ["text"]
    supported_outputs: ["json", "npz"]
    model_path: "backend/pretrained/ardy"
    enabled: true
    max_workers: 1
    model_parameters:
      checkpoint_variants:
        - "ARDY-Core-RP-20FPS-Horizon40"
        - "ARDY-Core-RP-20FPS-Horizon8"
        - "ARDY-G1-RP-25FPS-Horizon52"
        - "ARDY-G1-RP-25FPS-Horizon8"
      default_checkpoint: "ARDY-Core-RP-20FPS-Horizon40"
      supports_seed: true
      supports_constraints: true
      supports_postprocess: true
      fps: 20
      skeleton: "core"
