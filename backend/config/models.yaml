# Models Configuration
# Available models for each feature
# Use the actual adapter model IDs as defined in the adapter classes

# text-conditioned mesh painting
text_mesh_painting:
  trellis_text_mesh_painting:
    capabilities:
      text_mesh_painting: true
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 11776  # MB
    supported_inputs: ["mesh", "text"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

# image-conditioned geometry generation
image_to_raw_mesh:
  hunyuan3d_shape_v21_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [high_detail, thin_feature_sensitive]
      preferred_preprocessing: high_fidelity
      preferred_extraction: dense_marching_cubes
      preferred_resolution: 512
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      quality_priority: 85
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      paint_autochain: false
    vram_requirement: 10240  # MB (3.3B shape model)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2.1"
    enabled: true
    max_workers: 1

  hunyuan3d_dit_v2_mini_turbo_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [fine_surface_sampling, dense_marching_cubes]
      preferred_preprocessing: default
      preferred_extraction: dense_marching_cubes
      preferred_resolution: 512
      preferred_face_budget: medium
      recommended_postprocess_profile: default
      latency_class: fast
      quality_priority: 60
      multi_gpu: false
      paint_autochain: false
    vram_requirement: 6144  # MB (0.6B mini turbo model)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2mini"
    enabled: true
    max_workers: 1

  triposg_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [hierarchical_geometry, sharp_detail]
      preferred_preprocessing: high_fidelity
      preferred_extraction: hierarchical_octree
      preferred_resolution: 1024
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      quality_priority: 90
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
    vram_requirement: 8192  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TripoSG"
    enabled: true
    max_workers: 1

  unique3d_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      multiview_input: false
      generated_multiview: true
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      vertex_color: true
      mesh_quality_characteristics: [normal_bridged, multi_view_conditioned]
      preferred_preprocessing: high_fidelity
      preferred_extraction: normal_bridged_reconstruction
      preferred_resolution: 1024
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      super_resolution: true
    vram_requirement: 10240  # MB (estimated from measurement)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/Unique3D"
    enabled: true
    max_workers: 1
    init_params:
      seed: 1145
      input_processing: true
      do_refine: true
      expansion_weight: 0.1
      init_type: "std"

  pixal3d_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      native_pbr: true
      high_fidelity_geometry: true
      vertex_color: true
      mesh_quality_characteristics: [pixel_aligned_projection, pixel_to_3d_correspondence, open_surfaces, non_manifold_safe]
      preferred_preprocessing: high_fidelity
      preferred_extraction: o_voxel
      preferred_resolution: 1024
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: quality
      quality_priority: 95
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      low_vram_supported: true
      max_images: 1
      paint_autochain: false
    vram_requirement: 18432  # MB (~18GB standard, ~10-12GB low-vram mode)
    low_vram_requirement: 10240
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/Pixal3D"
    enabled: true
    max_workers: 1

  trellis_image_to_3d:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      max_images: 1
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 11776  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

  trellis_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      max_images: 1
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 11776  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

  trellis2_image_to_3d:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      native_pbr: false
      high_fidelity_geometry: true
      vertex_color: false
      mesh_quality_characteristics: [sharp_features, open_surfaces, non_manifold_safe]
      preferred_preprocessing: native_detail
      preferred_extraction: o_voxel
      preferred_resolution: 1536
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: quality
      quality_priority: 100
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
    vram_requirement: 23552  # MB (23GB, TRELLIS.2)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS.2"
    enabled: true
    max_workers: 1

  trellis2_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      native_pbr: false
      high_fidelity_geometry: true
      vertex_color: false
      mesh_quality_characteristics: [sharp_features, open_surfaces, non_manifold_safe]
