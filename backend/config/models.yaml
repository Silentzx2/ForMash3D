mesh_retopology:
  # EXPERIMENTAL_MAX_DETAIL: V1K is a fixed ~1k-vertex retopology checkpoint; no supported inference-step/guidance controls exist.
  fastmesh_v1k_retopology:
    model_name: "FastMesh — Retopology"
    upstream_repository: null
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: null
      retopology: true
      target_variant: "V1K"
      multi_gpu: true
      multi_gpu_strategy: accelerate_auto_device_map
    vram_requirement: 16384  # MB; conservative admission budget, not an upstream-published minimum
    init_params:
      variant: "V1K"
    supported_inputs: ["obj", "glb", "ply", "stl"]
    supported_outputs: ["obj", "glb", "ply"]
    model_path: "backend/pretrained/FastMesh-V1K"
    enabled: true
    max_workers: 1
    
  # EXPERIMENTAL_MAX_DETAIL: V4K is a fixed ~4k-vertex retopology checkpoint; no supported inference-step/guidance controls exist.
  fastmesh_v4k_retopology:
    model_name: "FastMesh — Retopology"
    upstream_repository: null
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: null
      retopology: true
      target_variant: "V4K"
      multi_gpu: true
      multi_gpu_strategy: accelerate_auto_device_map
    vram_requirement: 24500  # MB; conservative admission budget, not an upstream-published minimum
    init_params:
      variant: "V4K"
    supported_inputs: ["obj", "glb", "ply", "stl"]
    supported_outputs: ["obj", "glb", "ply"]
    model_path: "backend/pretrained/FastMesh-V4K"
    enabled: true
    max_workers: 1

# UV unwrapping
uv_unwrapping:
  # EXPERIMENTAL_MAX_DETAIL: retain official PartUV distortion threshold=1.25; larger thresholds explicitly permit more distortion. Adapter exposes no sampling-step/guidance controls.
  partuv_uv_unwrapping:
    model_name: "PartUV — UV Unwrapping"
    upstream_repository: null
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: null
      uv_unwrap: true
    vram_requirement: 7168  # MB
    supported_inputs: ["obj", "glb"]
    supported_outputs: ["obj"]
    model_path: "backend/pretrained/PartUV/model_objaverse.ckpt"
    enabled: true
    max_workers: 1

# Motion generation (ARDY)
motion_generation:
  # EXPERIMENTAL_MAX_DETAIL: keep the supported Core/G1 checkpoints and their trained FPS/horizon; upstream CLI CFG defaults to [2.0, 2.0] but this adapter does not expose cfg_weight.
  # Do not add unsupported CFG settings without implementation work; ask user once before changing this profile.
  ardy_motion_generation:
    model_name: "ARDY — Motion Generation"
    upstream_repository: "https://github.com/nv-tlabs/ardy"
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: null
      motion_generation: true
      cpu_only: true
    vram_requirement: 0  # CPU-only; no GPU VRAM reservation
    supported_inputs: ["text"]
    supported_outputs: ["json", "npz"]
    model_path: "backend/pretrained/ardy"
    enabled: true
    max_workers: 1
    model_parameters:
      checkpoint_variants:
        - "ARDY-Core-RP-20FPS-Horizon40"
        - "ARDY-Core-RP-20FPS-Horizon8"
        - "ARDY-G1-RP-25FPS-Horizon52"
        - "ARDY-G1-RP-25FPS-Horizon8"
      default_checkpoint: "ARDY-Core-RP-20FPS-Horizon40"
      supports_seed: true
      supports_constraints: true
      supports_postprocess: true
      fps: 20
      skeleton: "core"
