# Models Configuration
# Available models for each feature
# Use the actual adapter model IDs as defined in the adapter classes

# text-conditioned mesh painting
text_mesh_painting:
  trellis_text_mesh_painting:
    vram_requirement: 11776  # MB
    supported_inputs: ["mesh", "text"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

# image-conditioned geometry generation
image_to_raw_mesh:
  hunyuan3d_shape_v21_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [high_detail, thin_feature_sensitive]
      preferred_preprocessing: high_fidelity
      preferred_extraction: hierarchical_marching_cubes
      preferred_resolution: 512
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      quality_priority: 85
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      paint_autochain: true
    vram_requirement: 10240  # MB (3.3B shape model)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2.1"
    enabled: true
    max_workers: 1

  hunyuan3d_dit_v2_mini_turbo_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [fast, compact]
      preferred_preprocessing: default
      preferred_extraction: hierarchical_marching_cubes
      preferred_resolution: 512
      preferred_face_budget: medium
      recommended_postprocess_profile: default
      latency_class: fast
      quality_priority: 60
      multi_gpu: false
      paint_autochain: true
    vram_requirement: 6144  # MB (0.6B mini turbo model)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2mini"
    enabled: true
    max_workers: 1

  partpacker_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      parts: true
    vram_requirement: 10240  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/PartPacker"
    enabled: true
    max_workers: 1

  ultrashape_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
    vram_requirement: 26640  # MB (20GB: 8GB Hunyuan + 12GB UltraShape)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj", "ply"]
    model_path: "backend/pretrained/UltraShape"
    enabled: true
    max_workers: 1

  triposr_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      max_images: 1
    vram_requirement: 6144  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TripoSR"
    enabled: true
    max_workers: 1

  triposg_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [hierarchical_geometry, sharp_detail]
      preferred_preprocessing: high_fidelity
      preferred_extraction: hierarchical_octree
      preferred_resolution: 512
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      quality_priority: 90
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
    vram_requirement: 8192  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TripoSG"
    enabled: true
    max_workers: 1

  triposf_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      max_images: 1
    vram_requirement: 12288  # MB
    supported_inputs: ["image", "mesh"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TripoSF"
    enabled: true
    max_workers: 1

  unique3d_image_to_raw_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      multiview_input: false
      generated_multiview: true
      texture_generation: true
      raw_mesh: true
      high_fidelity_geometry: true
      vertex_color: true
      mesh_quality_characteristics: [normal_bridged, multi_view_conditioned]
      preferred_preprocessing: high_fidelity
      preferred_extraction: normal_bridged_reconstruction
      preferred_resolution: 1024
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      super_resolution: true
    vram_requirement: 10240  # MB (estimated from measurement)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/Unique3D"
    enabled: true
    max_workers: 1
    init_params:
      seed: 1145
      input_processing: true
      do_refine: true
      expansion_weight: 0.1
      init_type: "std"

# image-conditioned geometry+texture generation
image_to_textured_mesh:
  trellis_image_to_textured_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: true
      raw_mesh: false
      max_images: 1
    vram_requirement: 11776  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

  trellis2_image_to_textured_mesh:
    capabilities:
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: true
      raw_mesh: false
      native_pbr: true
      high_fidelity_geometry: true
      vertex_color: true
      mesh_quality_characteristics: [sharp_features, open_surfaces, non_manifold_safe]
      preferred_preprocessing: native_detail
      preferred_extraction: o_voxel
      preferred_resolution: 1536
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: quality
      quality_priority: 100
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
    vram_requirement: 23552  # MB (23GB, TRELLIS.2)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS.2"
    enabled: true
    max_workers: 1

# image-conditioned mesh painting
image_mesh_painting:
  trellis_image_mesh_painting:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
    vram_requirement: 11776  # MB
    supported_inputs: ["mesh", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

  trellis2_image_mesh_painting:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
    vram_requirement: 23552   # MB (23GB, TRELLIS.2)
    supported_inputs: ["mesh", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS.2"
    enabled: true
    max_workers: 1

  hunyuan3d_paint_v21_image_mesh_painting:
    capabilities:
      texture_generation: true
      texture_refine: true
      multiview: false
    vram_requirement: 12000  # MB — lowered from 21504; CPU offload keeps peak below 15GB
    supported_inputs: ["mesh", "text", "image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2.1"
    enabled: true
    max_workers: 1

# mesh segmentation
mesh_segmentation:
  partfield_mesh_segmentation:
    capabilities:
      segmentation: true
    vram_requirement: 4096  # MB
    supported_inputs: ["glb", "obj"]
    supported_outputs: ["glb"]
    model_path: "backend/pretrained/PartField/model_objaverse.pt"
    enabled: true
    max_workers: 1
  
  p3sam_mesh_segmentation:
    capabilities:
      segmentation: true
    vram_requirement: 61440  # MB (60GB, P3-SAM)
    supported_inputs: ["glb", "obj", "ply"]
    supported_outputs: ["glb"]
    model_path: "backend/pretrained/P3-SAM/p3sam.safetensors"
    enabled: true
    max_workers: 1

auto_rig:
  unirig_auto_rig:
    capabilities:
      auto_rig: true
      character_output: true
    vram_requirement: 9216  # MB
    supported_inputs: ["obj", "glb", "fbx"]
    supported_outputs: ["glb", "fbx"]
    model_path: "backend/pretrained/UniRig"
    enabled: true
    max_workers: 1

# mesh retopology
mesh_retopology:
  fastmesh_v1k_retopology:
    capabilities:
      retopology: true
      target_variant: "V1K"
    vram_requirement: 16384  # MB
    init_params:
      variant: "V1K"
    supported_inputs: ["obj", "glb", "ply", "stl"]
    supported_outputs: ["obj", "glb", "ply"]
    model_path: "backend/pretrained/FastMesh-V1K"
    enabled: true
    max_workers: 1
    
  fastmesh_v4k_retopology:
    capabilities:
      retopology: true
      target_variant: "V4K"
    vram_requirement: 24500  # MB
    init_params:
      variant: "V4K"
    supported_inputs: ["obj", "glb", "ply", "stl"]
    supported_outputs: ["obj", "glb", "ply"]
    model_path: "backend/pretrained/FastMesh-V4K"
    enabled: true
    max_workers: 1

# UV unwrapping
uv_unwrapping:
  partuv_uv_unwrapping:
    capabilities:
      uv_unwrap: true
    vram_requirement: 7168  # MB
    supported_inputs: ["obj", "glb"]
    supported_outputs: ["obj"]
    model_path: "backend/pretrained/PartUV/model_objaverse.ckpt"
    enabled: true
    max_workers: 1

# Mesh editing (local editing with VoxHammer)
text_mesh_editing:
  voxhammer_text_mesh_editing:
    capabilities:
      mesh_editing: true
      text_editing: true
    vram_requirement: 40960  # MB (40GB: TRELLIS + rendering)
    supported_inputs: ["mesh", "text"]
    supported_outputs: ["glb"]
    model_path: "backend/pretrained/VoxHammer"
    enabled: true
    max_workers: 1

image_mesh_editing:
  voxhammer_image_mesh_editing:
    capabilities:
      mesh_editing: true
      image_editing: true
    vram_requirement: 40960  # MB (40GB: TRELLIS + rendering)
    supported_inputs: ["mesh", "image"]
    supported_outputs: ["glb"]
    model_path: "backend/pretrained/VoxHammer"
    enabled: true
    max_workers: 1

# Motion generation (ARDY)
motion_generation:
  ardy_motion_generation:
    capabilities:
      motion_generation: true
    vram_requirement: 8192  # MB
    supported_inputs: ["text"]
    supported_outputs: ["json", "npz"]
    model_path: "backend/pretrained/ardy"
    enabled: true
    max_workers: 1
    model_parameters:
      checkpoint_variants:
        - "ARDY-Core-RP-20FPS-Horizon40"
        - "ARDY-Core-RP-20FPS-Horizon8"
        - "ARDY-G1-RP-25FPS-Horizon52"
        - "ARDY-G1-RP-25FPS-Horizon8"
      default_checkpoint: "ARDY-Core-RP-20FPS-Horizon40"
      supports_seed: true
      supports_constraints: true
      supports_postprocess: true
      fps: 20
      skeleton: "core"

# Multi-view generation (Zero123++ v1.2)
# Generates 6 novel viewpoints from a single image (3x2 grid, 30° azimuth intervals)
image_to_multiview:
  zero123plus_v12_image_to_multiview:
    capabilities:
      image_to_multiview: true
      multiview: true
      fixed_view_count: 6
      view_normals: true
      masks: true
      image_export: true
      hidden_from_model_selector: true
    vram_requirement: 5120  # MB
    supported_inputs: ["image"]
    supported_outputs: ["png", "zip"]
    model_path: "backend/pretrained/zero123plus-v1.2"
    enabled: true
    max_workers: 1
