      output_resolution: 1024
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [hierarchical_geometry, sharp_detail]
      preferred_preprocessing: high_fidelity
      preferred_extraction: hierarchical_octree
      preferred_resolution: 1024
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      quality_priority: 90
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      max_images: 1
    vram_requirement: 8192  # MB
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TripoSG"
    enabled: true
    max_workers: 1

  # EXPERIMENTAL_MAX_DETAIL: preserve upstream-supported do_refine=true, expansion_weight=0.1, init_type=std and seed=1145.
  # The adapter exposes no configurable inference steps/guidance control; do not invent unsupported knobs. Ask before changes.
  unique3d_image_to_raw_mesh:
    model_name: "Unique3D — Image to Raw Mesh"
    upstream_repository: "https://github.com/AiuniAI/Unique3D"
