# Models Configuration
# Available models for each feature
# Canonical model catalog: IDs, model names, upstream source, reviewed revision, checkpoint license, capabilities and VRAM reservation.
# EXPERIMENTAL_MAX_DETAIL settings snapshot: 2026-10-20.
# USER REQUIREMENT: cross normal limits for experimental quality testing; do not lower merely to fit a test GPU.
# Do not silently clamp over-limit settings. OOM/poor quality are valid test outcomes; user will lower after review.
# CHANGE CONTROL: before changing any locked parameter/profile later, ask the user once and wait for explicit confirmation.
# Evidence, limits, and source links: Docs/EXPERIMENTAL-MODEL-SETTINGS.md

# text-conditioned mesh painting
text_mesh_painting:
  # EXPERIMENTAL_MAX_DETAIL: TRELLIS supports up to 50 sampling steps; adapter has a shared guidance field, so it cannot express separate upstream SS=7.5 / SLAT=3.0 guidance without an implementation change.
  # Review note: keep raw geometry unsimplified and ask the user once before any future profile change.
  trellis_text_mesh_painting:
    model_name: "TRELLIS — Text Mesh Painting"
    upstream_repository: "https://github.com/microsoft/TRELLIS"
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: null
      text_mesh_painting: true
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    vram_requirement: 11776  # MB
    supported_inputs: ["mesh", "text"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/TRELLIS"
    enabled: true
    max_workers: 1

# image-conditioned geometry generation
image_to_raw_mesh:
  # EXPERIMENTAL_MAX_DETAIL: steps=100 (upstream UI maximum and community-tested experiment), guidance=5.0 (upstream default), octree=1300 (upstream maximum).
  # A/B outcome is unverified; raw master remains un-decimated. Ask the user once before later changing this profile.
  hunyuan3d_shape_v21_image_to_raw_mesh:
    model_name: "Hunyuan3D-2.1 Shape — Image to Raw Mesh"
    upstream_repository: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1"
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: 1300
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [high_detail, thin_feature_sensitive]
      preferred_preprocessing: high_fidelity
      preferred_extraction: dense_marching_cubes
      preferred_resolution: 1300
      preferred_face_budget: high
      recommended_postprocess_profile: high_fidelity
      latency_class: balanced
      quality_priority: 85
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      paint_autochain: false
    vram_requirement: 10240  # MB (3.3B shape model)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2.1"
    enabled: true
    max_workers: 1

  # Active adapter lock (not the upstream-trained recipe): octree_resolution=768, 20 steps, CFG=7.5.
  # This deliberately exceeds the documented distilled 5-step / octree=380 recipe and may OOM or produce artifacts.
  # This entry describes the active stress-test profile; preserve its numerical values unless the owner approves a change.
  hunyuan3d_dit_v2_mini_turbo_image_to_raw_mesh:
    model_name: "Hunyuan3D Mini Turbo — Image to Raw Mesh"
    upstream_repository: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2"
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
      native_topology: false
      output_resolution: 768
      text_to_3d: false
      image_to_3d: true
      multiview: false
      texture_generation: false
      raw_mesh: true
      high_fidelity_geometry: true
      mesh_quality_characteristics: [fine_surface_sampling, dense_marching_cubes]
      preferred_preprocessing: default
      preferred_extraction: dense_marching_cubes
      preferred_resolution: 768
      preferred_face_budget: medium
      recommended_postprocess_profile: default
      latency_class: fast
      quality_priority: 60
      multi_gpu: false
      paint_autochain: false
    vram_requirement: 6144  # MB (0.6B mini turbo model)
    supported_inputs: ["image"]
    supported_outputs: ["glb", "obj"]
    model_path: "backend/pretrained/tencent/Hunyuan3D-2mini"
    enabled: true
    max_workers: 1

  # Active adapter lock: 100 steps, CFG=9.0, flash depth=10, dense depth=10, hierarchical depth=11.
  # The VRAM gate may lower the effective hierarchical depth; this is not the upstream default and has not been A/B benchmarked.
  # Preserve the locked profile and distinguish requested depth from runtime-effective depth in telemetry.
  triposg_image_to_raw_mesh:
    model_name: "TripoSG — Image to Raw Mesh"
    upstream_repository: "https://github.com/VAST-AI-Research/TripoSG"
    upstream_ref: null # Pin to a reviewed commit/tag only after adapter compatibility is verified
    checkpoint_license: "unverified"
    capabilities:
