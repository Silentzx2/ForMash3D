events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512M;

    upstream api_backend {
        server api:7842;
    }

    upstream web_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Static assets generated by backend storage
        location /static/ {
            proxy_pass http://api_backend/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend API routes with WebSocket support
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Backend OpenAPI documentation & health routes
        location /docs {
            proxy_pass http://api_backend/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api_backend/openapi.json;
            proxy_set_header Host $host;
        }
        location /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
        }

        # Next.js Frontend application with WebSocket / HMR support
        location / {
            proxy_pass http://web_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
